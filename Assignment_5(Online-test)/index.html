<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Online Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Screen 1 -->
<div id="screen1" class="conatiner">
    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="logo">
        <h1>Welcome to Online Test</h1>
        <p class="rules">Read the rules carefully before starting the test.</p>
        <ul class="rules-list">
            <li>There are 15 randomly selected questions.</li>
            <li>No negative marking.</li>
            <li>You cannot skip without selecting an answer.</li>
        </ul>
        <button class="btn start" onclick="startTest()">Start Test</button>
    </div>
</div>

<!-- Screen 2 -->
<div id="screen2" class="hidden">
    <div class="question-card">
        <h2 id="questionText"></h2>
        <div id="optionsBox"></div>

        <div class="nav-buttons">
            <button class="btn back" onclick="prevQuestion()">← Back</button>
            <button class="btn next" onclick="nextQuestion()">Next →</button>
        </div>
    </div>
</div>

<!-- Screen 3 -->
<div id="screen3" class="hidden">
    <div class="card">
        <h1 id="scoreText"></h1>
        <h2>Review Answers</h2>
        <div id="reviewBox"></div>
    </div>
</div>

<script src="script.js"></script>
<!-- Load Questions Data -->
 <script src="questions.js"></script>


</body>
</html>
